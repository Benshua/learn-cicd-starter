name: go CI
run-name: keep working on it

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: unit test 
        run: go test ./... -cover

  formatting:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: formatting test
        run: test -z $(go fmt ./...)